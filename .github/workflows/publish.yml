name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: verify tag matches mod version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MOD_VERSION=$(grep '^mod.version' stonecutter.properties.toml | cut -d'"' -f2)
          if [[ "$TAG" != "v$MOD_VERSION" ]]; then
            echo "::error::tag $TAG does not match mod.version $MOD_VERSION in stonecutter.properties.toml"
            exit 1
          fi
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
            25
          distribution: 'temurin'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: cache loom
        uses: actions/cache@v6
        with:
          path: .gradle/loom-cache
          key: loom-${{ hashFiles('stonecutter.properties.toml', 'settings.gradle.kts') }}
      - name: determine version type
        id: version_type
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-alpha"* ]]; then
            echo "type=alpha" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-beta"* ]]; then
            echo "type=beta" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi
      - name: generate modrinth description
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          sed -E \
            -e "s#(!\[[^]]*\]\()([^):\#/][^):]*\))#\1https://raw.githubusercontent.com/$REPO/$REF/\2#g" \
            -e "s#(^|[^!])(\[[^]]*\]\()([^):\#/][^):]*\))#\1\2https://github.com/$REPO/blob/$REF/\3#g" \
            README.md > MODRINTH.md
      - name: generate changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          MOD_VERSION=$(grep '^mod.version' stonecutter.properties.toml | cut -d'"' -f2)
          awk -v heading="## $MOD_VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { lines[++n] = $0 }
            END {
              first = 1; while (first <= n && lines[first] == "") first++
              last = n; while (last >= first && lines[last] == "") last--
              for (i = first; i <= last; i++) print lines[i]
            }' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $MOD_VERSION"
            exit 1
          fi
          echo >> release-notes.md
          gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq '.body' >> release-notes.md
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: publish to modrinth
        run: ./gradlew modrinth modrinthSyncBody
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VERSION_TYPE: ${{ steps.version_type.outputs.type }}
          CHANGELOG_FILE: release-notes.md
      - name: create github release
        uses: softprops/action-gh-release@v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          files: versions/*/build/libs/*.jar
          fail_on_unmatched_files: true
          prerelease: ${{ steps.version_type.outputs.type != 'release' }}
          body_path: release-notes.md
